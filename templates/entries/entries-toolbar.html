<div class="card shadow-sm mb-3">
    <div class="card-body py-2 px-3">
        <div class="row align-items-center">

            <!-- Record actions -->
            <div class="col-lg-4 mb-2 mb-lg-0">
                <div class="btn-group" role="group">
                    <a href="/entries/{{ .entry.ID }}/edit"
                       class="btn btn-primary btn-sm">
                        <i class="bi bi-pencil mr-1"></i> Edit
                    </a>
                    <a href="/entries/{{ .entry.ID }}/clone"
                       class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-files mr-1"></i> Clone
                    </a>
                    <a href="/entries/{{ .entry.ID }}/delete"
                       class="btn btn-outline-danger btn-sm">
                        <i class="bi bi-trash mr-1"></i> Delete
                    </a>
                </div>
            </div>

            <!-- Record navigation -->
            <div class="col-lg-4 mb-2 mb-lg-0 text-lg-center">
                <div class="btn-group" role="group">
                    {{ if (gt .entry.MediaID 1) }}
                        <a href="/entries/{{ .entry.ID }}/previous"
                           class="btn btn-outline-secondary btn-sm">
                            <i class="bi bi-chevron-left"></i> Previous
                        </a>
                    {{ end }}

                    {{ if ne .entry.MediaID .maxMediaID }}
                        <a href="/entries/{{ .entry.ID }}/next"
                           class="btn btn-outline-secondary btn-sm">
                            Next <i class="bi bi-chevron-right"></i>
                        </a>
                    {{ end }}
                </div>
            </div>

            <!-- Media lookup -->
            <div class="col-lg-4">
                <form action="/entries/find" method="post" class="form-inline justify-content-lg-end">
                    <label for="media_id" class="mr-2 text-muted small">
                        Lookup Media
                    </label>

                    <input type="number"
                           id="media_id"
                           name="media_id"
                           class="form-control form-control-sm mr-2"
                           style="width: 100px;">

                    <input type="hidden"
                           name="resource_id"
                           value="{{ .resource.ID }}">

                    <button type="submit" class="btn btn-outline-primary btn-sm">
                        Go
                    </button>
                </form>
            </div>

        </div>
    </div>
</div>
