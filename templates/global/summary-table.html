<div class="table-responsive">
    <table class="table table-sm mb-0">
        <thead class="thead-light">
            <tr>
                <th scope="col">Media type</th>
                <th scope="col" class="text-right">Count</th>
                <th scope="col" class="text-right">Size</th>
            </tr>
        </thead>
        <tbody>
            {{ range $mediatype := .summary }}
                <tr>
                    <td>{{ getMediatype $mediatype.Mediatype }}</td>
                    <td class="text-right">{{ $mediatype.Count }}</td>
                    <td class="text-right text-nowrap">{{ $mediatype.HumanSize }}</td>
                </tr>
            {{ end }}
        </tbody>
        <tfoot>
            <tr class="font-weight-bold border-top">
                <td>Totals</td>
                <td class="text-right">{{ .totals.Count }}</td>
                <td class="text-right text-nowrap">{{ .totals.HumanSize }}</td>
            </tr>
        </tfoot>
    </table>
</div>
