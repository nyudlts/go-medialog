{{ template "header.html" .}}
<br>

<div class="card card-default">
    <div class="card-header">
        <h5 class="card-title">Repositories</h5>
    </div>
    <div class="card-body">
        <div class="card">
            <div class="card-header">
                <strong>Repositories</strong>
            </div>
            <div class="card-body p-0">
                <div class="list-group list-group-flush">
                    {{ range $repository := .repositories }}
                    <div class="list-group-item d-flex justify-content-between align-items-center">
                        <div>
                            <strong>{{ $repository.Title }}</strong>
                            <small class="text-muted">({{ $repository.Slug }})</small>
                        </div>
                        <div class="btn-group btn-group-sm">
                            <a class="btn btn-primary" href="/repositories/{{ $repository.ID }}/show">View</a>
                            <a class="btn btn-secondary" href="/repositories/{{ $repository.ID }}/edit">Edit</a>
                        </div>
                    </div>
                    {{ end }}
                </div>
            </div>
        </div>
    </div>
</div>

{{ template "footer.html" .}}
